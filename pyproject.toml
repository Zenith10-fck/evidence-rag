[project]
name = "evidence-rag"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic==2.4.0",
    "fastapi==0.162.0",
    "numpy==2.4.6",
    "pgvector==0.5.1",
    "psycopg[binary]==3.3.8",
    "pydantic-settings==2.16.2",
    "pypdf==6.21.4",
    "python-multipart==0.0.33",
    "uvicorn[standard]==0.54.0",
    "voyageai==0.5.0",
]

[project.optional-dependencies]
# Free local embeddings with voyageai/voyage-4-nano (CPU). Large download (torch).
local = [
    "sentence-transformers",
    "transformers",
    "torch",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "matplotlib==3.11.2",
    "pytest==9.2.0",
    "reportlab==5.1.0",
    "ruff==0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]
"scripts/*" = ["S"]
"scripts/make_corpus.py" = ["S", "E501"]  # document text is data

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["db: needs the Postgres test database (skipped if unreachable)"]
