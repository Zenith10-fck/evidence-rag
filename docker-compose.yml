# Postgres + pgvector, and the API.
#
#   cp .env.example .env   (fill API_KEY, POSTGRES_PASSWORD, ANTHROPIC_API_KEY, VOYAGE_API_KEY)
#   docker compose up --build   -> http://localhost:8000/ui   (live mode: Postgres + Voyage + Claude)
#   Load the documents once:    uv run --extra local python scripts/ingest_corpus.py   (see README)
#
# The database is bound to 127.0.0.1 only. There is no default password or key: compose refuses to
# start until the values above are set.
services:
  db:
    image: pgvector/pgvector:0.8.4-pg16
    environment:
      POSTGRES_USER: evidence
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: evidence_rag
    ports:
      - "127.0.0.1:5433:5432"   # 5433 on the host so it does not clash with another Postgres
    volumes:
      - evidence_rag_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evidence -d evidence_rag"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      EVIDENCE_RAG_MODE: live
      DATABASE_URL: postgresql://evidence:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/evidence_rag
      API_KEY: ${API_KEY:?set API_KEY in .env}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY in .env}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:?set VOYAGE_API_KEY in .env}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-auto}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  evidence_rag_data:
